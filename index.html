<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Church Display</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }

    #picture {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: none;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    #message {
      color: white;
      font: 20px Arial, sans-serif;
      text-align: center;
      padding-top: 40vh;
    }
  </style>
</head>

<body>
  <img id="picture" alt="Church Display">
  <div id="message">Loading picture...</div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzS0SQV9nMn75wgZI2Y1RaSMpEAWGuwGJfj5aZtf5M8N8ZZSobJ15V8wOcLleQo1-QI/exec";

    const TIMEZONE = "America/Toronto";

    const params = new URLSearchParams(location.search);

    const mode = params.get("view") === "event"
      ? "event"
      : "daily";

    const picture = document.getElementById("picture");
    const message = document.getElementById("message");

    let currentImageKey = "";
    let requestNumber = 0;
    let lastDailyTransition = "";

    // Display a new image only after it has loaded.
    function displayImage(result, requestId) {
      // The image has not changed.
      if (result && result.unchanged === true) {
        return;
      }

      // Missing image or server error.
      if (!result || !result.image) {
        if (!currentImageKey) {
          message.textContent =
            (result && result.error) || "Picture not found";
        }
        return;
      }

      const imageKey = result.imageKey || result.image;

      if (imageKey === currentImageKey) {
        return;
      }

      // Preload the new image to prevent flickering.
      const nextImage = new Image();

      nextImage.onload = function() {
        // Ignore an outdated request.
        if (requestId !== requestNumber) {
          return;
        }

        picture.src = nextImage.src;
        picture.style.display = "block";
        message.style.display = "none";
        currentImageKey = imageKey;
      };

      nextImage.onerror = function() {
        if (!currentImageKey && requestId === requestNumber) {
          message.textContent = "Unable to load picture";
        }
      };

      nextImage.src = result.image;
    }

    // Request the latest image from Google Apps Script.
    function updatePicture() {
      const requestId = ++requestNumber;
      const callbackName = "churchCallback_" + requestId;

      const script = document.createElement("script");
      let finished = false;
      let timeoutId;

      function cleanup() {
        if (finished) return;
        finished = true;

        clearTimeout(timeoutId);
        script.remove();

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }
      }

      window[callbackName] = function(result) {
        if (requestId === requestNumber) {
          displayImage(result, requestId);
        }
        cleanup();
      };

      // Send the current image key so Apps Script can
      // avoid sending an unchanged image again.
      script.src = SCRIPT_URL
        + "?format=js"
        + "&view=" + encodeURIComponent(mode)
        + "&callback=" + encodeURIComponent(callbackName)
        + "&currentKey=" + encodeURIComponent(currentImageKey)
        + "&t=" + Date.now();

      script.onerror = function() {
        if (!currentImageKey && requestId === requestNumber) {
          message.textContent = "Connection error";
        }
        cleanup();
      };

      timeoutId = setTimeout(function() {
        if (!currentImageKey && requestId === requestNumber) {
          message.textContent = "Connection timeout";
        }
        cleanup();
      }, 60000);

      document.body.appendChild(script);
    }

    // Read the current Toronto date and time.
    function getTorontoTime() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TIMEZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      const get = type =>
        parts.find(p => p.type === type).value;

      return {
        date: get("year") + "-" +
              get("month") + "-" +
              get("day"),
        hour: Number(get("hour")),
        minute: Number(get("minute")),
        second: Number(get("second"))
      };
    }

    // Detect the daily saint change at 7 PM.
    function checkDailyTransition() {
      if (mode !== "daily") return;

      const now = getTorontoTime();

      if (now.hour === 19 && now.minute === 0) {
        if (lastDailyTransition !== now.date) {
          lastDailyTransition = now.date;
          updatePicture();
        }
      }
    }

    // Load the first image.
    updatePicture();

    // Check for image changes every 10 minutes.
    setInterval(updatePicture, 10 * 60 * 1000);

    // Check the clock every second.
    setInterval(checkDailyTransition, 1000);

    // Refresh when the browser wakes up.
    document.addEventListener("visibilitychange", function() {
      if (!document.hidden) {
        updatePicture();
        checkDailyTransition();
      }
    });

    // Refresh when the browser regains focus.
    window.addEventListener("focus", function() {
      updatePicture();
      checkDailyTransition();
    });

    // Prevent the image context menu.
    document.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    });

    // Prevent common browser zoom shortcuts.
    document.addEventListener("keydown", function(e) {
      if (
        (e.ctrlKey || e.metaKey) &&
        ["+", "-", "=", "0"].includes(e.key)
      ) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
