
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Church Display</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }

    #picture {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: none;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    #message {
      color: white;
      font: 20px Arial, sans-serif;
      text-align: center;
      padding-top: 40vh;
    }
  </style>
</head>

<body>
  <img id="picture" alt="Church Display">
  <div id="message">Loading picture...</div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzS0SQV9nMn75wgZI2Y1RaSMpEAWGuwGJfj5aZtf5M8N8ZZSobJ15V8wOcLleQo1-QI/exec";

    const TIMEZONE = "America/Toronto";

    const REFRESH_INTERVAL = 10 * 60 * 1000;
    const REQUEST_TIMEOUT = 60 * 1000;
    const WAKE_COOLDOWN = 60 * 1000;

    const params = new URLSearchParams(location.search);

    const mode = params.get("view") === "event"
      ? "event"
      : "daily";

    const picture = document.getElementById("picture");
    const message = document.getElementById("message");

    let currentImageKey = "";

    let requestNumber = 0;
    let requestInProgress = false;
    let pendingTransition = false;

    let lastRequestTime = 0;
    let lastDailyTransition = "";

    // ======================================
    // DISPLAY IMAGE WITHOUT FLICKERING
    // ======================================

    function displayImage(result, requestId) {
      if (result && result.unchanged === true) {
        return;
      }

      if (!result || !result.image) {
        if (!currentImageKey) {
          message.textContent =
            (result && result.error) || "Picture not found";
        }
        return;
      }

      const imageKey = result.imageKey || result.image;

      if (imageKey === currentImageKey) {
        return;
      }

      const nextImage = new Image();

      nextImage.onload = function() {
        if (requestId !== requestNumber) {
          return;
        }

        picture.src = nextImage.src;
        picture.style.display = "block";
        message.style.display = "none";

        currentImageKey = imageKey;
      };

      nextImage.onerror = function() {
        if (!currentImageKey && requestId === requestNumber) {
          message.textContent = "Unable to load picture";
        }
      };

      nextImage.src = result.image;
    }

    // ======================================
    // REQUEST CONTROL
    // ======================================

    function updatePicture(force = false) {
      // Never allow overlapping requests.
      if (requestInProgress) {
        if (force) {
          pendingTransition = true;
        }
        return;
      }

      const now = Date.now();

      // Prevent unnecessary requests.
      if (!force && now - lastRequestTime < WAKE_COOLDOWN) {
        return;
      }

      requestInProgress = true;
      lastRequestTime = now;

      const requestId = ++requestNumber;
      const callbackName = "churchCallback_" + requestId;

      const script = document.createElement("script");

      let finished = false;
      let timeoutId;

      function cleanup() {
        if (finished) return;

        finished = true;
        requestInProgress = false;

        clearTimeout(timeoutId);
        script.remove();

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }

        // Process a 7 PM transition that occurred
        // while the previous request was running.
        if (pendingTransition) {
          pendingTransition = false;
          updatePicture(true);
        }
      }

      window[callbackName] = function(result) {
        if (requestId === requestNumber) {
          displayImage(result, requestId);
        }

        cleanup();
      };

      script.src = SCRIPT_URL
        + "?format=js"
        + "&view=" + encodeURIComponent(mode)
        + "&callback=" + encodeURIComponent(callbackName)
        + "&currentKey=" + encodeURIComponent(currentImageKey)
        + "&t=" + Date.now();

      script.onerror = function() {
        if (!currentImageKey) {
          message.textContent = "Connection error";
        }

        cleanup();
      };

      timeoutId = setTimeout(function() {
        if (!currentImageKey) {
          message.textContent = "Connection timeout";
        }

        cleanup();
      }, REQUEST_TIMEOUT);

      document.body.appendChild(script);
    }

    // ======================================
    // TORONTO LOCAL TIME
    // ======================================

    function getTorontoTime() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TIMEZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      const get = type =>
        parts.find(p => p.type === type).value;

      return {
        date: get("year") + "-" +
              get("month") + "-" +
              get("day"),
        hour: Number(get("hour")),
        minute: Number(get("minute")),
        second: Number(get("second"))
      };
    }

    // ======================================
    // DAILY CHANGE AT 7 PM
    // ======================================

    function checkDailyTransition() {
      if (mode !== "daily") return;

      const now = getTorontoTime();

      if (
        now.hour === 19 &&
        now.minute === 0 &&
        lastDailyTransition !== now.date
      ) {
        lastDailyTransition = now.date;

        // The 7 PM change bypasses the cooldown.
        updatePicture(true);
      }
    }

    // ======================================
    // INITIAL IMAGE
    // ======================================

    updatePicture();

    // ======================================
    // AUTOMATIC REFRESH EVERY 10 MINUTES
    // ======================================

    setInterval(function() {
      updatePicture();
    }, REFRESH_INTERVAL);

    // ======================================
    // CHECK CLOCK EVERY SECOND
    // ======================================

    setInterval(function() {
      checkDailyTransition();
    }, 1000);

    // ======================================
    // BROWSER WAKE / FOCUS PROTECTION
    // ======================================

    function refreshAfterWake() {
      // Only refresh when enough time has passed.
      // Avoid repeated focus-triggered requests.
      if (Date.now() - lastRequestTime >= REFRESH_INTERVAL) {
        updatePicture();
      }

      checkDailyTransition();
    }

    document.addEventListener("visibilitychange", function() {
      if (!document.hidden) {
        refreshAfterWake();
      }
    });

    window.addEventListener("focus", function() {
      refreshAfterWake();
    });

    // ======================================
    // PREVENT CONTEXT MENU
    // ======================================

    document.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    });

    // ======================================
    // PREVENT BROWSER ZOOM SHORTCUTS
    // ======================================

    document.addEventListener("keydown", function(e) {
      if (
        (e.ctrlKey || e.metaKey) &&
        ["+", "-", "=", "0"].includes(e.key)
      ) {
        e.preventDefault();
      }
    });

  </script>
</body>
</html>
